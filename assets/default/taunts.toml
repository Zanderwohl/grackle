# Each taunt is a clip under `animations/` and what performing it does to the
# body. `claims` are the parts the taunt takes from the layers beneath it:
# legs, torso, head, arm.l, arm.r, weapon, or a region a rig names itself (a
# strider's tail), which claims nothing on a rig without it. `movement` is "free", "stopped",
# or { slowed = 0.5 }. `turning` is how far the body follows the aim: "free",
# "locked", or { at_most = 90 } degrees a second; the camera always turns.
# `weapon` is "hidden" or "shown". `length` is seconds until it ends by
# itself, or "clip" for as long as its clip; leave it out and it lasts until G
# is pressed again. The animation editor writes this file and keeps comments.

[wave]
clip = "taunt_wave"
claims = ["legs", "torso", "head", "arm.l", "arm.r", "weapon"]
movement = "stopped"
turning = "locked"
weapon = "hidden"
length = "clip"
