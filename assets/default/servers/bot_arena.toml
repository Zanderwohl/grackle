# A server's round settings, for `--server-config`. Every key is optional and
# defaults to what the Round tab starts with.
#
# `slots`           players in a round, the host and bots included, 1 to 32.
# `bots_enabled`    false seats no bot at all, and a round starts without
#                   baking the nav graph (default true).
# `fill_with_bots`  keep the slots nobody has taken filled with bots.
# `bot_skill`       "easy", "normal" (the default), "hard", or "varied",
#                   which rolls each trait across its whole range.
# `bots`            bots seated by hand at startup: they
#                   count against the slots and stay across rounds.
# `time_limit`      seconds before the round ends; absent or 0 is no limit.
# `frag_limit`      frags that end the round (default 20); 0 is no limit.
# `bot_only_matches`  run matches with no person playing, as long as bots are
#                   seated. Off by default.
# `pre_game_length`   seconds of countdown before each match (default 10).
# `post_game_length`  the most seconds of humiliation after each match
#                   (default 15).
# `between_rounds_length`  seconds of the scoreboard after the post-game
#                   (default 15).
# `respawn_time`    seconds a player waits after dying before coming back
#                   (default 3).
#
# This one fills a round with eight bots, the host spectating, for five minutes.
# The host spectates, so nobody is playing, which needs bot-only matches:
#
#     cargo run -- --map assets/default/blueprints/arena.gmb --server-config assets/default/servers/bot_arena.toml --play --spectate --rounds 1

slots = 8
fill_with_bots = true
time_limit = 300
bot_only_matches = true
pre_game_length = 3
