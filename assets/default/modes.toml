# What each game mode changes, keyed the way a map file names its mode
# (`arena`, `ctf`, `pl`, `plr`, `koth`, `cp`, `sd`). A mode with no entry plays
# by the defaults: teams, every class, each class's own loadout.
#
# `teams`    false puts nobody on a side; everybody is hostile to everybody.
# `classes`  which classes may be played, by the names `classes.toml` uses, in
#            the order the class picker shows them. Empty or absent allows all
#            of them. With only one, nobody is asked.
# `loadout`  what a body starts with, by the names `weapons.toml` uses. Each
#            lands in the slot its class's loadout permits it in. Absent is the
#            class's own loadout.
# `frag_limit` a mode with one keeps a scoreboard; absent is none. What ends
#            the round is the server's own frag limit (the Round tab), until
#            each mode has settings of its own.
# `self_damage` what hurting yourself costs, as a fraction of what it would
#            cost anybody else; knockback is not scaled. Absent is 1.

[arena]
teams = false
classes = ["mercenary", "scout", "raptor"]
loadout = ["pistol"]
frag_limit = 20
self_damage = 0.5

[ctf]
classes = ["scout", "soldier", "pyro", "demoman", "heavy", "engineer", "medic", "civilian", "mercenary"]

[pl]
classes = ["scout", "soldier", "pyro", "demoman", "heavy", "engineer", "medic", "civilian", "mercenary"]

[plr]
classes = ["scout", "soldier", "pyro", "demoman", "heavy", "engineer", "medic", "civilian", "mercenary"]

[koth]
classes = ["scout", "soldier", "pyro", "demoman", "heavy", "engineer", "medic", "civilian", "mercenary"]

[cp]
classes = ["scout", "soldier", "pyro", "demoman", "heavy", "engineer", "medic", "civilian", "mercenary"]

[sd]
classes = ["scout", "soldier", "pyro", "demoman", "heavy", "engineer", "medic", "civilian", "mercenary"]
