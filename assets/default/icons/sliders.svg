<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- Keeps the lines out of the hollow circle. -->
    <mask id="ring" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#ffffff" />
      <circle cx="19" cy="19" r="2.6" fill="#000000" />
    </mask>
  </defs>
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" mask="url(#ring)">
    <line x1="3" y1="11" x2="19" y2="11" />
    <line x1="3" y1="19" x2="19" y2="19" />
    <line x1="11" y1="3" x2="11" y2="19" />
    <line x1="19" y1="3" x2="19" y2="19" />
  </g>
  <g fill="#ffffff">
    <circle cx="11" cy="11" r="2.6" />
    <circle cx="11" cy="19" r="2.6" />
  </g>
  <circle cx="19" cy="19" r="2.6" fill="none" stroke="#ffffff" stroke-width="1.6" />
</svg>
