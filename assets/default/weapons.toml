# Every weapon in the default pack.
#
# The table key is the weapon's id. It is hashed into a `WeaponId` at load and
# that number is what travels — so renaming a weapon here renames it
# everywhere, and two weapons that hash alike are caught at load rather than in
# a fight.
#
# `name_key` is a lang key and not a name. Display text lives in
# `lang/<code>.toml` like every other string in the game.
#
# Each of `primary` and `secondary` is one mouse button: what it does, how fast
# it answers being held, and what it costs. A button that does nothing says so
# with `kind = "none"` rather than being left out. A `semi` cadence fires once
# per press and an `automatic` one while held; both fire at most once every
# `interval` seconds (absent on `semi` is no limit), and a press inside that
# is dropped.
#
# `model` names a prop under `props/`, without its extension — the geometry the
# weapon is drawn as, modeled in the prop editor. It is a name rather
# than a path because a client is told which prop to build and builds it from
# its own pack. Omitted means nobody has modeled this weapon yet.
#
# **Animations, when they exist, go at the bottom of an entry.** Not tidiness:
# a TOML array-of-tables header captures every key written after it, so an
# `[[weapons.x.animations]]` followed by `name_key` would quietly make that a
# property of the animation. The fields above are the ones people tune, so they
# come first. Nothing enforces this — weapons.toml is read by code and never
# written by it.
#
# `bucket` is the digit that selects it, 1 to 9, as in Source. Weapons may
# share a bucket: pressing its digit again moves along them, in the order of
# the loadout slots they are carried in. `deploy` is how many seconds after
# being drawn it may fire; its `deploy` clip, if the model has one, is
# stretched to fit.
#
# `magazine.clip` omitted means the weapon has no clip at all: its whole supply
# is loaded, each shot comes straight out of the reserve, and it never reloads.
# That is the minigun, and it is an absent clip rather than a clip the size of
# the reserve, which would be a lie the reload system then has to keep
# believing.

[weapons.laser_rifle]
name_key = "weapon.names.laser_rifle"
bucket = 1
deploy = 0.6
model = "sniper_rifle"
magazine = { clip = 12, reserve = 60, reload = 1.0 }
primary = { cadence = { kind = "semi", interval = 0.5 }, cost = { kind = "ammo", rounds = 1 }, action = { kind = "hitscan", range = 200.0, damage = 30, headshot_multiplier = 3, shove_per_damage = 0.15, shove_radius = 0.4 } }
secondary = { cadence = { kind = "semi" }, cost = { kind = "free" }, action = { kind = "scope", zoom = 2.5 } }

# TF2's: 90 at the center of the blast, which is also what a rocket landing on
# somebody does, falling to half at the 2.8 m edge. To others, 125% with the
# shooter beside the blast, full at 5 m and 52.8% at 10 m and beyond, as the
# shotgun's lines run; your own blast is never scaled by distance. The first
# rocket of a reload takes 0.92 s, each after it 0.8.
[weapons.rocket_launcher]
name_key = "weapon.names.rocket_launcher"
bucket = 2
deploy = 0.5
model = "rocket_launcher"
magazine = { clip = 4, reserve = 20, reload = 0.8, reload_one_at_a_time = true, first_reload = 0.92 }
primary = { cadence = { kind = "semi", interval = 0.8 }, cost = { kind = "ammo", rounds = 1 }, action = { kind = "projectile", initial_speed = 20.0, gravity_factor = 0.0, air_resistance = 0.0, spin_rate = 0.0, max_bounces = 0, restitution = 0.0, max_lifetime = 8.0, explodes_at_last_bounce = true, explodes_at_lifetime_end = false, explosion_radius = 2.8, damage = 90, splash_at_edge = 0.5, ramp_up = { near = 0.0, far = 5.0, scale = 1.25 }, falloff = { near = 5.0, far = 10.0, scale = 0.528 }, knockback = 9.0, radius = 0.12 } }
secondary = { cadence = { kind = "semi" }, cost = { kind = "free" }, action = { kind = "none" } }

# The TF2C-style RPG: the same rocket as above, but it falls — one number
# apart, which is the point of the spec being numbers rather than a type.
#
# One in the clip, so the arc is a shot you commit to rather than one of four.
# The reload is the weapon: everything about it is arranged so that a miss
# costs you a second and a half.
[weapons.rpg]
name_key = "weapon.names.rpg"
bucket = 2
deploy = 0.7
model = "rpg"
magazine = { clip = 1, reserve = 8, reload = 1.5 }
primary = { cadence = { kind = "semi", interval = 0.8 }, cost = { kind = "ammo", rounds = 1 }, action = { kind = "projectile", initial_speed = 34.0, gravity_factor = 1.0, air_resistance = 0.0, spin_rate = 0.0, max_bounces = 0, restitution = 0.0, max_lifetime = 8.0, explodes_at_last_bounce = true, explodes_at_lifetime_end = false, explosion_radius = 3.2, damage = 110, splash_at_edge = 0.0, knockback = 11.0, radius = 0.14 } }
secondary = { cadence = { kind = "semi" }, cost = { kind = "free" }, action = { kind = "none" } }

# The demoman's: pills that arc, tumble, bounce off a wall and go off on their
# fuse — or the instant they land on somebody, since a direct hit detonates
# whatever the spec says.
#
# Two bounces rather than four, because a pill's fuse is meant to be the thing
# that ends it and a pill still rattling round a corner after four walls is a
# sticky. A real stickybomb launcher wants an action nothing has yet: one that
# sets bombs down and detonates them when told, rather than on a timer.
#
# Reloaded one round at a time, so firing out of a half-full clip is a choice.
[weapons.pill_launcher]
name_key = "weapon.names.pill_launcher"
bucket = 2
deploy = 0.5
model = "pill_launcher"
magazine = { clip = 4, reserve = 16, reload = 0.6, reload_one_at_a_time = true }
primary = { cadence = { kind = "semi", interval = 0.6 }, cost = { kind = "ammo", rounds = 1 }, action = { kind = "projectile", initial_speed = 23.0, gravity_factor = 1.0, air_resistance = 0.1, spin_rate = 12.0, max_bounces = 2, restitution = 0.45, max_lifetime = 2.3, explodes_at_last_bounce = true, explodes_at_lifetime_end = true, explosion_radius = 3.4, damage = 100, splash_at_edge = 0.0, knockback = 10.0, radius = 0.14 } }
secondary = { cadence = { kind = "semi" }, cost = { kind = "free" }, action = { kind = "none" } }

# Weak and quick, for finishing what something else started. Eight in the
# clip, thirty-two in all. No headshot bonus: that is the laser rifle's.
[weapons.pistol]
name_key = "weapon.names.pistol"
bucket = 2
deploy = 0.35
model = "pistol"
magazine = { clip = 8, reserve = 24, reload = 1.1 }
primary = { cadence = { kind = "semi", interval = 0.33 }, cost = { kind = "ammo", rounds = 1 }, action = { kind = "hitscan", range = 120.0, damage = 15, headshot_multiplier = 1, shove_per_damage = 0.15, shove_radius = 0.35 } }
secondary = { cadence = { kind = "semi" }, cost = { kind = "free" }, action = { kind = "none" } }

# Nine pellets in a fixed 3×3 square that is a meter wide at thirty meters,
# seven apiece before distance, and fewer land the further the square opens past
# a body. `ramp_up` and `falloff` are a line each in meters from the eye: half
# again as much point blank, full at 5 m, half at 10 m and beyond — 95 point
# blank, 63 at 5 m, 32 at 10 m if every pellet lands. `reload` is per shell. `kill_shove` throws the body back off its feet,
# but only on the shot that kills it: meters per second along the aim, `lift`
# straight up on top, over `radius` meters around the hit.
[weapons.shotgun]
name_key = "weapon.names.shotgun"
bucket = 1
deploy = 0.5
model = "shotgun"
magazine = { clip = 6, reserve = 32, reload = 0.625, reload_one_at_a_time = true }
primary = { cadence = { kind = "semi", interval = 0.625 }, cost = { kind = "ammo", rounds = 1 }, action = { kind = "hitscan", range = 100.0, damage = 7, headshot_multiplier = 1, shove_per_damage = 0.15, shove_radius = 0.3, pellets = { across = 3, spread = 30.0 }, ramp_up = { near = 0.0, far = 5.0, scale = 1.5 }, falloff = { near = 5.0, far = 10.0, scale = 0.5 }, kill_shove = { speed = 10.0, lift = 3.0, radius = 1.2 } } }
secondary = { cadence = { kind = "semi" }, cost = { kind = "free" }, action = { kind = "none" } }

# No clip: the whole supply is loaded, and it never reloads.
[weapons.flamethrower]
name_key = "weapon.names.flamethrower"
bucket = 1
deploy = 0.5
model = "flamethrower"
magazine = { reserve = 200, reload = 0.0 }
primary = { cadence = { kind = "automatic", interval = 0.1 }, cost = { kind = "ammo", rounds = 1 }, action = { kind = "flame", range = 6.0, spread = 0.28, rays = 5, damage = 7, afterburn_duration = 6.0, afterburn_damage = 4, afterburn_interval = 0.5 } }
secondary = { cadence = { kind = "automatic", interval = 0.75 }, cost = { kind = "ammo", rounds = 20 }, action = { kind = "extinguish", range = 6.0, spread = 0.28 } }

[weapons.medi_wrench]
name_key = "weapon.names.medi_wrench"
bucket = 3
deploy = 0.4
model = "medi_wrench"
magazine = { reserve = 0, reload = 0.0 }
primary = { cadence = { kind = "automatic", interval = 0.1 }, cost = { kind = "free" }, action = { kind = "heal_beam", range = 8.0, heal_per_second = 24 } }
secondary = { cadence = { kind = "semi" }, cost = { kind = "charge", fraction = 1.0 }, action = { kind = "invulnerable", duration = 8.0, cooldown = 0.0 } }
