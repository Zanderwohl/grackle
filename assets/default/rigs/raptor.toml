# A rig a class can name in classes.toml with `rig = "raptor"`: two
# digitigrade legs, a long neck, a tail, and short arms folded under the chest that grip a
# weapon as a humanoid's do. Bones are where they rest in a body
# `height` meters tall, feet on the floor, facing -Z, parents first. A build
# resizes the rig to its own height and lengthens each `group` by its scale.
#
# `region` is one of legs, torso, head, arm.l, arm.r, or a name of the rig's
# own that a taunt can claim; `limit` a joint kind
# (fixed, spine, neck, head, clavicle, shoulder, elbow, wrist, hip, knee,
# ankle, unlisted); `profile` a shape (pelvis, chest, neck, head, clavicle,
# upper_arm, forearm, hand, thigh, shin, foot, default). `stops` replace
# `limit` with a hinge's range, degrees from rest, positive swinging the tail
# forward.

height = 1.6
# A hold's carry is measured from the spine's tail, between the shoulders, in arm-lengths.
carry = "spine"
head = "head"
hands = ["right_arm", "left_arm"]

[measures]
leg = "left_leg"
arm = "right_arm"
hip = "pelvis"
# Its own eye, in its head, rather than the shared 1.8 m above a body 1.6 m tall.
eye = "head"
# Crouched, the crown sits this share of the way up the crouched box: lower than it needs, so
# the raptor stalks with its head down rather than standing tall inside it.
crouched_crown = 0.82

[[bones]]
name = "pelvis"
head = [0.0, 0.85, 0.0]
tail = [0.0, 0.95, -0.15]
thickness = [0.26, 0.2]
group = "torso"
region = "legs"
limit = "fixed"
profile = "pelvis"

[[bones]]
name = "spine"
parent = "pelvis"
head = [0.0, 0.95, -0.15]
tail = [0.0, 1.05, -0.45]
thickness = [0.24, 0.22]
group = "torso"
region = "torso"
limit = "spine"
profile = "chest"

[[bones]]
name = "neck"
parent = "spine"
head = [0.0, 1.05, -0.45]
tail = [0.0, 1.4, -0.6]
thickness = [0.09, 0.09]
group = "neck"
region = "head"
limit = "neck"
profile = "neck"

[[bones]]
name = "head"
parent = "neck"
head = [0.0, 1.4, -0.6]
tail = [0.0, 1.6, -0.7]
thickness = [0.14, 0.18]
region = "head"
limit = "head"
profile = "head"

# Every arm joint is the widest cone: a corpse's limits use its parent's frame, whose roll is
# untracked once it rolls, and a narrower limit can point the arm into the floor.
[[bones]]
name = "upper_arm.l"
parent = "spine"
head = [-0.1, 0.99, -0.41]
tail = [-0.13, 0.8, -0.4]
thickness = [0.06, 0.06]
group = "arm"
region = "arm.l"
limit = "shoulder"
profile = "upper_arm"

[[bones]]
name = "forearm.l"
parent = "upper_arm.l"
head = [-0.13, 0.8, -0.4]
tail = [-0.12, 0.79, -0.61]
thickness = [0.05, 0.05]
group = "arm"
region = "arm.l"
limit = "shoulder"
profile = "forearm"

[[bones]]
name = "hand.l"
parent = "forearm.l"
head = [-0.12, 0.79, -0.61]
tail = [-0.11, 0.72, -0.68]
thickness = [0.035, 0.06]
group = "arm"
region = "arm.l"
limit = "shoulder"
profile = "hand"

[[bones]]
name = "upper_arm.r"
parent = "spine"
head = [0.1, 0.99, -0.41]
tail = [0.13, 0.8, -0.4]
thickness = [0.06, 0.06]
group = "arm"
region = "arm.r"
limit = "shoulder"
profile = "upper_arm"

[[bones]]
name = "forearm.r"
parent = "upper_arm.r"
head = [0.13, 0.8, -0.4]
tail = [0.12, 0.79, -0.61]
thickness = [0.05, 0.05]
group = "arm"
region = "arm.r"
limit = "shoulder"
profile = "forearm"

[[bones]]
name = "hand.r"
parent = "forearm.r"
head = [0.12, 0.79, -0.61]
tail = [0.11, 0.72, -0.68]
thickness = [0.035, 0.06]
group = "arm"
region = "arm.r"
limit = "shoulder"
profile = "hand"

[[bones]]
name = "tail.1"
parent = "pelvis"
head = [0.0, 0.9, 0.05]
tail = [0.0, 0.87, 0.25]
thickness = [0.11, 0.11]
group = "tail"
region = "tail"
limit = "spine"

[[bones]]
name = "tail.2"
parent = "tail.1"
head = [0.0, 0.87, 0.25]
tail = [0.0, 0.84, 0.45]
thickness = [0.09, 0.09]
group = "tail"
region = "tail"
limit = "spine"

[[bones]]
name = "tail.3"
parent = "tail.2"
head = [0.0, 0.84, 0.45]
tail = [0.0, 0.8, 0.65]
thickness = [0.07, 0.07]
group = "tail"
region = "tail"
limit = "spine"

[[bones]]
name = "thigh.l"
parent = "pelvis"
head = [-0.12, 0.85, 0.0]
tail = [-0.12, 0.56, -0.1]
thickness = [0.12, 0.12]
group = "leg"
region = "legs"
limit = "hip"
profile = "thigh"

# Rests bent 59 degrees; a named knee is measured from straight.
[[bones]]
name = "shin.l"
parent = "thigh.l"
head = [-0.12, 0.56, -0.1]
tail = [-0.12, 0.3, 0.12]
thickness = [0.09, 0.09]
group = "leg"
region = "legs"
stops = [-80.0, 55.0]
profile = "shin"

# The hock rests bent 67 degrees the other way; positive bends it further.
[[bones]]
name = "metatarsus.l"
parent = "shin.l"
head = [-0.12, 0.3, 0.12]
tail = [-0.12, 0.06, 0.0]
thickness = [0.07, 0.07]
group = "leg"
region = "legs"
stops = [-60.0, 80.0]
profile = "shin"

[[bones]]
name = "foot.l"
parent = "metatarsus.l"
head = [-0.12, 0.06, 0.0]
tail = [-0.12, 0.0, -0.22]
thickness = [0.09, 0.06]
group = "leg"
region = "legs"
limit = "ankle"
profile = "foot"

[[bones]]
name = "thigh.r"
parent = "pelvis"
head = [0.12, 0.85, 0.0]
tail = [0.12, 0.56, -0.1]
thickness = [0.12, 0.12]
group = "leg"
region = "legs"
limit = "hip"
profile = "thigh"

# Rests bent 59 degrees; a named knee is measured from straight.
[[bones]]
name = "shin.r"
parent = "thigh.r"
head = [0.12, 0.56, -0.1]
tail = [0.12, 0.3, 0.12]
thickness = [0.09, 0.09]
group = "leg"
region = "legs"
stops = [-80.0, 55.0]
profile = "shin"

# The hock rests bent 67 degrees the other way; positive bends it further.
[[bones]]
name = "metatarsus.r"
parent = "shin.r"
head = [0.12, 0.3, 0.12]
tail = [0.12, 0.06, 0.0]
thickness = [0.07, 0.07]
group = "leg"
region = "legs"
stops = [-60.0, 80.0]
profile = "shin"

[[bones]]
name = "foot.r"
parent = "metatarsus.r"
head = [0.12, 0.06, 0.0]
tail = [0.12, 0.0, -0.22]
thickness = [0.09, 0.06]
group = "leg"
region = "legs"
limit = "ankle"
profile = "foot"

# Named as the humanoid's are, so shared clips that move an arm move these.
[[limbs]]
name = "right_arm"
upper = "upper_arm.r"
lower = "forearm.r"
tip = "hand.r"
side = 1.0

[[limbs]]
name = "left_arm"
upper = "upper_arm.l"
lower = "forearm.l"
tip = "hand.l"
side = -1.0

# Digitigrade: the knee bends toward the pole (forward) and the hock away.
[[limbs]]
name = "left_leg"
upper = "thigh.l"
between = ["shin.l"]
lower = "metatarsus.l"
tip = "foot.l"
side = -1.0
straightens = true
bends_away = ["metatarsus.l"]

[[limbs]]
name = "right_leg"
upper = "thigh.r"
between = ["shin.r"]
lower = "metatarsus.r"
tip = "foot.r"
side = 1.0
straightens = true
bends_away = ["metatarsus.r"]

# Three bones, so solved by FABRIK within each joint's limit. It sags between base and tip:
# bowed up, a lifted tail would need its base to rise further than the joint allows. A target
# the tail cannot reach, it reaches toward rather than dropping to rest.
[[limbs]]
name = "tail"
upper = "tail.1"
between = ["tail.2"]
lower = "tail.3"
side = 0.0
pole = [0.0, -1.0, 0.0]
straightens = true

[[feet]]
limb = "left_leg"
phase = 0.0

[[feet]]
limb = "right_leg"
phase = 0.5

# Forearms and hands only, as on the humanoid.
[[viewmodel]]
bone = "forearm.r"
hand = 0

[[viewmodel]]
bone = "hand.r"
hand = 0

[[viewmodel]]
bone = "forearm.l"
hand = 1

[[viewmodel]]
bone = "hand.l"
hand = 1

[[look]]
bone = "neck"
share = 0.4

[[look]]
bone = "head"
share = 0.6

# Turned back against the legs when they swing toward where the body is going: the body
# faces halfway, the head the aim.
[[twist]]
bone = "spine"
share = 0.5

[[twist]]
bone = "neck"
share = 0.25

[[twist]]
bone = "head"
share = 0.25
