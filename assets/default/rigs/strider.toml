# A rig a class can name in classes.toml with `rig = "strider"`: two
# digitigrade legs, a long neck and a tail, and no arms. Bones are where they rest in a body
# `height` meters tall, feet on the floor, facing -Z, parents first. A build
# resizes the rig to its own height and lengthens each `group` by its scale.
#
# `region` is one of legs, torso, head, arm.l, arm.r, or a name of the rig's
# own that a taunt can claim; `limit` a joint kind
# (fixed, spine, neck, head, clavicle, shoulder, elbow, wrist, hip, knee,
# ankle, unlisted); `profile` a shape (pelvis, chest, neck, head, clavicle,
# upper_arm, forearm, hand, thigh, shin, foot, default). `stops` are a hinge's
# own, in degrees from rest, positive swinging the tail forward, for a joint
# that rests bent.

height = 1.6
carry = "spine"
head = "head"
# No hands, so a weapon rides here: meters from the spine's tail along the aim.
mount = { bone = "spine", offset = [0.0, 0.14, -0.1] }

[measures]
leg = "left_leg"
hip = "pelvis"

[[bones]]
name = "pelvis"
head = [0.0, 0.85, 0.0]
tail = [0.0, 0.95, -0.15]
thickness = [0.26, 0.2]
group = "torso"
region = "legs"
limit = "fixed"
profile = "pelvis"

[[bones]]
name = "spine"
parent = "pelvis"
head = [0.0, 0.95, -0.15]
tail = [0.0, 1.05, -0.45]
thickness = [0.24, 0.22]
group = "torso"
region = "torso"
limit = "spine"
profile = "chest"

[[bones]]
name = "neck"
parent = "spine"
head = [0.0, 1.05, -0.45]
tail = [0.0, 1.4, -0.6]
thickness = [0.09, 0.09]
group = "neck"
region = "head"
limit = "neck"
profile = "neck"

[[bones]]
name = "head"
parent = "neck"
head = [0.0, 1.4, -0.6]
tail = [0.0, 1.6, -0.7]
thickness = [0.14, 0.18]
region = "head"
limit = "head"
profile = "head"

[[bones]]
name = "tail.1"
parent = "pelvis"
head = [0.0, 0.9, 0.05]
tail = [0.0, 0.87, 0.25]
thickness = [0.11, 0.11]
group = "tail"
region = "tail"
limit = "spine"

[[bones]]
name = "tail.2"
parent = "tail.1"
head = [0.0, 0.87, 0.25]
tail = [0.0, 0.84, 0.45]
thickness = [0.09, 0.09]
group = "tail"
region = "tail"
limit = "spine"

[[bones]]
name = "tail.3"
parent = "tail.2"
head = [0.0, 0.84, 0.45]
tail = [0.0, 0.8, 0.65]
thickness = [0.07, 0.07]
group = "tail"
region = "tail"
limit = "spine"

[[bones]]
name = "thigh.l"
parent = "pelvis"
head = [-0.12, 0.85, 0.0]
tail = [-0.12, 0.56, -0.1]
thickness = [0.12, 0.12]
group = "leg"
region = "legs"
limit = "hip"
profile = "thigh"

# Rests bent 59 degrees, so its stops are its own: a knee's are measured from straight.
[[bones]]
name = "shin.l"
parent = "thigh.l"
head = [-0.12, 0.56, -0.1]
tail = [-0.12, 0.3, 0.12]
thickness = [0.09, 0.09]
group = "leg"
region = "legs"
stops = [-80.0, 55.0]
profile = "shin"

# The hock, bent 67 degrees the other way: positive bends it further.
[[bones]]
name = "metatarsus.l"
parent = "shin.l"
head = [-0.12, 0.3, 0.12]
tail = [-0.12, 0.06, 0.0]
thickness = [0.07, 0.07]
group = "leg"
region = "legs"
stops = [-60.0, 80.0]
profile = "shin"

[[bones]]
name = "foot.l"
parent = "metatarsus.l"
head = [-0.12, 0.06, 0.0]
tail = [-0.12, 0.0, -0.22]
thickness = [0.09, 0.06]
group = "leg"
region = "legs"
limit = "ankle"
profile = "foot"

[[bones]]
name = "thigh.r"
parent = "pelvis"
head = [0.12, 0.85, 0.0]
tail = [0.12, 0.56, -0.1]
thickness = [0.12, 0.12]
group = "leg"
region = "legs"
limit = "hip"
profile = "thigh"

# Rests bent 59 degrees, so its stops are its own: a knee's are measured from straight.
[[bones]]
name = "shin.r"
parent = "thigh.r"
head = [0.12, 0.56, -0.1]
tail = [0.12, 0.3, 0.12]
thickness = [0.09, 0.09]
group = "leg"
region = "legs"
stops = [-80.0, 55.0]
profile = "shin"

# The hock, bent 67 degrees the other way: positive bends it further.
[[bones]]
name = "metatarsus.r"
parent = "shin.r"
head = [0.12, 0.3, 0.12]
tail = [0.12, 0.06, 0.0]
thickness = [0.07, 0.07]
group = "leg"
region = "legs"
stops = [-60.0, 80.0]
profile = "shin"

[[bones]]
name = "foot.r"
parent = "metatarsus.r"
head = [0.12, 0.06, 0.0]
tail = [0.12, 0.0, -0.22]
thickness = [0.09, 0.06]
group = "leg"
region = "legs"
limit = "ankle"
profile = "foot"

# Digitigrade: the knee bends toward the pole (forward) and the hock away.
[[limbs]]
name = "left_leg"
upper = "thigh.l"
between = ["shin.l"]
lower = "metatarsus.l"
tip = "foot.l"
side = -1.0
straightens = true
bends_away = ["metatarsus.l"]

[[limbs]]
name = "right_leg"
upper = "thigh.r"
between = ["shin.r"]
lower = "metatarsus.r"
tip = "foot.r"
side = 1.0
straightens = true
bends_away = ["metatarsus.r"]

# Three bones, so solved by FABRIK within each joint's limit; it bends up.
[[limbs]]
name = "tail"
upper = "tail.1"
between = ["tail.2"]
lower = "tail.3"
side = 0.0
pole = [0.0, 1.0, 0.0]

[[feet]]
limb = "left_leg"
phase = 0.0

[[feet]]
limb = "right_leg"
phase = 0.5

[[look]]
bone = "neck"
share = 0.4

[[look]]
bone = "head"
share = 0.6
