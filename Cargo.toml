[package]
name = "grackle"
version = "0.1.0"
edition = "2024"
default-run = "editor"

[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
bevy = "0.20.0"
bevy_vector_shapes = "0.14.0"
crossbeam-channel = "0.5.15"

bevy_egui = "0.43.1"
egui_dock = "0.21.1"

clap = { version = "4.5.31", features = ["derive"] }

serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
# Lightmaps are half-float textures.
half = "2"
typetag = "0.2"
# `preserve_order`: `G` plays the first taunt in its file.
toml = { version = "0.8.20", features = ["preserve_order"] }

rfd = "0.15"
pollster = "0.4"

lazy_static = "1.5.0"
regex = "1.11.1"

strum = "0.27.1"
strum_macros = "0.27.2"
rand = "0.9.2"
lightyear = { version = "0.31", features = ["netcode", "udp", "input_native"] }

# Tracks texture-graph's main; Cargo.lock holds the commit, and
# `cargo update -p texture-graph-core` moves it. Its egui and wgpu have to be
# the ones bevy_egui and bevy use, or the editor's types do not meet ours, so
# move it and bevy together. `default-features = false` keeps core's `std-fs`
# off, which wasm needs.
texture-graph-core = { git = "https://github.com/Zanderwohl/texture-graph", branch = "main", default-features = false }
texture-graph-gpu = { git = "https://github.com/Zanderwohl/texture-graph", branch = "main" }
texture-graph-editor = { git = "https://github.com/Zanderwohl/texture-graph", branch = "main" }
# Bevy's own version, named so the material editor can hand texture-graph the
# wgpu types it bakes with. Must match what `cargo tree -i wgpu` shows.
wgpu = "30.0.1"
egui_extras = { version = "0.36.1", default-features = false, features = ["svg"] }

# Only used from tests: the encoding Lightyear puts messages on the wire in. A
# message carrying an internally tagged enum fails to *decode* at the far end
# and nowhere else, which is a silent bug on a live connection — so the tests
# encode the way the wire does rather than the way JSON does.
[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }

# Not used from Rust: a direct dependency only so feature unification turns on
# `wasm_js` for the copies bevy_egui, bevy_platform and rand_core pull in.
# Paired with the `getrandom_backend` rustflag in `.cargo/config.toml`, which
# is what actually selects the backend — the feature alone compiles nothing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.3", features = ["wasm_js"] }

# Not used from Rust at all: a direct dependency purely so feature unification
# turns on `relax-sign-encoding` for the copy winit pulls in, which is what
# stops the macOS 26 beta from tripping objc2's signature assertions. Scoped to
# macOS because it is an Apple-only crate — declared unconditionally it broke
# the build on every other target, wasm included.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.1", features = ["relax-sign-encoding"] }

# Belt to that feature's braces: objc2's own debug assertions are what fire.
# Left unconditional because a profile entry naming a package outside the
# graph is simply ignored — checked against a wasm32 build, which resolves and
# compiles past this without complaint.
[profile.dev.package.objc2]
debug-assertions = false

[[bin]]
name = "editor"
path = "src/main.rs"

[[bin]]
name = "ensure_lang"
path = "src/bin/ensure_lang.rs"

[[bin]]
name = "crate_drop"
path = "src/bin/crate_drop.rs"
